<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Video Preference Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="9" height="14" rx="2.5"/><rect x="13" y="5" width="9" height="14" rx="2.5"/></svg>
      <span>Video Preference Study</span>
    </div>
    <div class="status" id="status" hidden>
      <span id="count"></span>
      <div class="progress"><div id="bar"></div></div>
    </div>
  </header>

  <main>
    <section id="intro" class="screen card narrow">
      <p class="eyebrow">Research study</p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="chips">
        <span class="chip" id="chip-time"></span>
        <span class="chip" id="chip-pairs"></span>
        <span class="chip">Anonymous</span>
      </div>
      <ol class="steps" id="instructions"></ol>
      <div class="form">
        <label class="field" for="expertise">Have you worked with AI image or video generation before?</label>
        <div class="segmented" id="expertise" role="radiogroup">
          <button type="button" data-v="none" role="radio" aria-checked="false">No</button>
          <button type="button" data-v="user" role="radio" aria-checked="false">Yes, as a user</button>
          <button type="button" data-v="researcher" role="radio" aria-checked="false">Yes, as a researcher</button>
        </div>
        <label class="check">
          <input type="checkbox" id="consent">
          <span>I agree to take part. My answers are recorded anonymously and used only for research.</span>
        </label>
      </div>
      <button id="start" class="primary big" disabled>Start</button>
      <p id="resume-note" class="muted" hidden>You have an unfinished session in this browser. Start picks up where you left off.</p>
    </section>

    <section id="trial" class="screen" hidden>
      <div class="prompt-card">
        <p class="eyebrow" id="question"></p>
        <p class="prompt" id="prompt"></p>
      </div>
      <div class="pair" id="pair">
        <div class="option" id="opt-left">
          <div class="frame">
            <video id="vid-left" muted loop playsinline preload="auto"></video>
            <span class="badge">A</span>
          </div>
          <button id="pick-left" class="choice" disabled><kbd>&larr;</kbd> I prefer A</button>
        </div>
        <div class="option" id="opt-right">
          <div class="frame">
            <video id="vid-right" muted loop playsinline preload="auto"></video>
            <span class="badge">B</span>
          </div>
          <button id="pick-right" class="choice" disabled>I prefer B <kbd>&rarr;</kbd></button>
        </div>
      </div>
      <div class="unlock">
        <div class="unlock-track"><div id="unlock-bar"></div></div>
        <p class="muted" id="wait">Watch both videos…</p>
      </div>
    </section>

    <section id="done" class="screen card narrow center" hidden>
      <div class="tick" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1>Thank you!</h1>
      <p class="lead">Your answers have been recorded. You can close this page.</p>
      <p id="code" class="code" hidden></p>
      <p id="sync" class="muted"></p>
      <button id="download" hidden>Download my answers (JSON)</button>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
